name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build portable Windows x64 EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build standalone GUI
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Create portable ZIP
        shell: pwsh
        run: >-
          Compress-Archive -Path dist/FH6_Addon_Linker.exe, README.md, LICENSE, docs/USAGE.md
          -DestinationPath dist/FH6_Addon_Linker-windows-x64.zip -Force

      - name: Upload executable and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FH6_Addon_Linker-windows-x64
          path: |
            dist/FH6_Addon_Linker.exe
            dist/FH6_Addon_Linker-windows-x64.zip
          if-no-files-found: error
