name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Install package
        run: python -m pip install -e .

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q

      - name: Smoke-test GUI imports
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import fh6linker.gui.app, fh6linker.gui.dialogs, fh6linker.gui.theme, fh6linker.gui.wizard"
